services:
  - type: web
    name: century-link-session
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: STUDENT_FIRST_NAME
        sync: false
      - key: STUDENT_LAST_NAME
        sync: false
      - key: BROWSER_VIEW_URL_TEMPLATE
        sync: false
